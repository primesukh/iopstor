<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ title or 'Untitled' }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{# a standalone document, so it needs the site's fonts itself or the canvas previews in a
   different typeface from the page it is previewing #}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='canvas.css') }}">
<script src="{{ url_for('static', filename='vendor/sortable.min.js') }}"></script>
</head>
<body class="iop-canvas">
<main id="main">
  {% if not has_hero %}<div class="wrap page-head"><h1 class="page-title">{{ title or 'Untitled page' }}</h1>{% if excerpt %}<p class="lead">{{ excerpt }}</p>{% endif %}</div>{% endif %}
  {{ body }}
</main>
</body>
</html>
