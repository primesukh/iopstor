<section class="hero"><div class="wrap">
  <h1>{{ data.heading }}</h1>
  {% if data.subheading %}<p>{{ data.subheading }}</p>{% endif %}
  {% if data.cta_url %}<a class="btn" href="{{ data.cta_url }}">{{ data.cta_label or 'Learn more' }}</a>{% endif %}
  {% if data.image %}<img src="{{ media_url(data.image) }}" alt="{{ data.heading }}">{% endif %}
</div></section>
