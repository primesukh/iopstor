{# One menus row as a list. The drop-downs are edited under /admin/menus; a footer column shows the
   top level only, which is what base.html always did. #}
<section class="section{{ cls }}"{{ sty }}{{ fe() }}><div class="wrap">
  {% if data.heading or edit %}<h4{{ fe('heading') }}>{{ data.heading }}</h4>{% endif %}
  <ul>{% for i in menu(data.menu) %}<li><a href="{{ i.url }}">{{ i.label }}</a></li>{% endfor %}</ul>
</div></section>
