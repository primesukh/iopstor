<section class="section"{{ fe() }}><div class="wrap">
  {% if data.heading or edit %}<h2 class="section-title"{{ fe('heading') }}>{{ data.heading }}</h2>{% endif %}
  {% if request.args.get('sent') %}<div class="notice">Thank you — we have received your message and will get back to you shortly.</div>{% endif %}
  <form class="lead-form" method="post" action="/api/v1/leads">
    <input type="hidden" name="kind" value="{{ data.kind }}">
    <input type="hidden" name="back" value="{{ request.path }}">
    {% if request.args.get('product') %}<input type="hidden" name="product" value="{{ request.args.get('product') }}"><p class="post-meta">About: <strong>{{ request.args.get('product') }}</strong></p>{% endif %}
    <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
    <label>Name <input name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Phone <input name="phone"></label>
    <label>Company <input name="company"></label>
    <label>Message <textarea name="message"></textarea></label>
    <button type="submit" class="btn">Send message</button>
  </form>
</div></section>
