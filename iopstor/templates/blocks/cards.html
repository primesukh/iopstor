<section class="section"><div class="wrap">
  {% if data.heading %}<h2 class="section-title">{{ data.heading }}</h2>{% endif %}
  <div class="cards">{% for c in data['items'] %}{% if c.url %}<a class="card" href="{{ c.url }}">{% else %}<div class="card">{% endif %}{% if c.icon %}<div style="font-size:1.8rem">{{ c.icon }}</div>{% endif %}<h3>{{ c.title }}</h3>{% if c.text %}<p>{{ c.text }}</p>{% endif %}{% if c.url %}</a>{% else %}</div>{% endif %}{% endfor %}</div>
</div></section>
